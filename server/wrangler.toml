name = "diagonal-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# NOTE: account_id is an identifier, not a credential (the API token is
# never stored here — pass it via CLOUDFLARE_API_TOKEN env var).
account_id = "3a3c78db80d271226caeb10f8ba124e8"

# Custom domains (zone_id is a public DNS identifier, not a secret).
# Apex serves the landing + /privacy-policy; api.* serves the app API.
# workers.dev stays enabled so already-shipped builds keep working.
routes = [
  { pattern = "diagonalreader.com/*", zone_id = "7e4cdb7f0a9e53b7bf33cdca22d8923b" },
  { pattern = "api.diagonalreader.com/*", zone_id = "7e4cdb7f0a9e53b7bf33cdca22d8923b" },
]

[vars]
MODEL = "google/gemini-3.5-flash-lite"

# Page-quota database. database_id comes from `wrangler d1 create
# diagonal` (run once); migrations/ is applied with
# `wrangler d1 migrations apply diagonal --local` / `--remote`.
[[d1_databases]]
binding = "DB"
database_name = "diagonal"
database_id = "b13d20f2-5edb-4799-a95f-cf646182f860"

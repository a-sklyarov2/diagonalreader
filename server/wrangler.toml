name = "diagonal-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# NOTE: account_id is an identifier, not a credential (the API token is
# never stored here — pass it via CLOUDFLARE_API_TOKEN env var).
account_id = "3a3c78db80d271226caeb10f8ba124e8"

[vars]
MODEL = "google/gemini-3.5-flash-lite"

# Page-quota database. database_id comes from `wrangler d1 create
# diagonal` (run once); migrations/ is applied with
# `wrangler d1 migrations apply diagonal --local` / `--remote`.
[[d1_databases]]
binding = "DB"
database_name = "diagonal"
database_id = "00000000-0000-0000-0000-000000000000" # TODO: fill in
